name: Auto Release

on:
  push:
    branches:
      - deploy # deployブランチへのマージをトリガーにする
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body: "mainブランチからのデプロイ更新"
          draft: false
          prerelease: false